<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500">
  <defs>
    <!-- Soft, Moody Mint Ambient Radial Glow behind the compact graphite discs -->
    <radialGradient id="suiteAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4EE49B" stop-opacity="0.32"/>
      <stop offset="46%" stop-color="#4EE49B" stop-opacity="0.26"/>
      <stop offset="65%" stop-color="#2D9665" stop-opacity="0.12"/>
      <stop offset="85%" stop-color="#124028" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Status Capsule Frosted Glass -->
    <linearGradient id="suiteTopCapsuleGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222B36" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#141822" stop-opacity="0.94"/>
    </linearGradient>

    <!-- Bottom Telemetry Card Frosted Glass -->
    <linearGradient id="suiteBottomCardGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B222E" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#0E131A" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <style>
    .sf-bold { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif; font-weight: 700; }
    .sf-semibold { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif; font-weight: 600; }
    .sf-regular { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; font-weight: 400; }
  </style>

  <!-- Canvas Background -->
  <rect width="980" height="500" fill="#000000"/>

  <!-- ========================================================================= -->
  <!-- SCREEN 1 (LEFT): INIT / READY SCREEN                                      -->
  <!-- ========================================================================= -->
  <g id="Screen_Init_Ready" transform="translate(18, 23)">
    <!-- OLED Bezel -->
    <circle cx="227" cy="227" r="227" fill="#000000"/>
    <circle cx="227" cy="227" r="225.5" fill="none" stroke="#222733" stroke-width="1.5"/>

    <!-- Ambient Glow radiating from behind compact graphite disc -->
    <circle cx="227" cy="142" r="88" fill="url(#suiteAmbientGlow)"/>

    <!-- Top Status Pill (Ready) -->
    <g id="Init_Status_Pill" transform="translate(162, 38)">
      <rect width="130" height="38" rx="19" fill="url(#suiteTopCapsuleGlass)" stroke="#323C4C" stroke-width="1.2"/>
      <circle cx="33" cy="19" r="4.5" fill="#4EE49B"/>
      <circle cx="33" cy="19" r="7.5" fill="#4EE49B" fill-opacity="0.25"/>
      <text x="49" y="24.5" class="sf-semibold" font-size="15.5" fill="#FFFFFF" letter-spacing="-0.2">Ready</text>
    </g>

    <!-- Center Navigation Pod -->
    <g id="Init_Center_Pod">
      <circle cx="227" cy="142" r="42" fill="#1C212B"/>
      <g id="Init_Arrow" transform="translate(227, 142) scale(0.8)">
        <path d="M 0 -25
                 C 1.5 -27 3.5 -27 5 -25
                 L 22 18
                 C 23.8 21.2 21.2 24.5 17.5 23.5
                 L 0 13
                 L -17.5 23.5
                 C -21.2 24.5 -23.8 21.2 -22 18
                 Z" 
              fill="#4EE49B"
              stroke="#4EE49B"
              stroke-width="3"
              stroke-linejoin="round"
              stroke-linecap="round"/>
      </g>
    </g>

    <!-- Typography -->
    <g id="Init_Typography">
      <text x="227" y="234" text-anchor="middle" class="sf-bold" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">Navigation IQ</text>
      <text x="227" y="264" text-anchor="middle" class="sf-regular" font-size="16" fill="#8C98A9" letter-spacing="-0.1">Waiting for navigation</text>
    </g>

    <!-- Clock Pill -->
    <g id="Init_Clock_Pill" transform="translate(172, 332)">
      <rect width="110" height="44" rx="22" fill="url(#suiteTopCapsuleGlass)" stroke="#27313E" stroke-width="1.2"/>
      <text x="55" y="28" text-anchor="middle" class="sf-semibold" font-size="19" fill="#FFFFFF" letter-spacing="0.2">21:29</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- SCREEN 2 (RIGHT): ARRIVED / DESTINATION REACHED                           -->
  <!-- ========================================================================= -->
  <g id="Screen_Destination_Arrived" transform="translate(508, 23)">
    <!-- OLED Bezel -->
    <circle cx="227" cy="227" r="227" fill="#000000"/>
    <circle cx="227" cy="227" r="225.5" fill="none" stroke="#222733" stroke-width="1.5"/>

    <!-- Ambient Glow radiating from behind compact graphite disc -->
    <circle cx="227" cy="142" r="88" fill="url(#suiteAmbientGlow)"/>

    <!-- Top Status Capsule Pill (Arrived • 56s) -->
    <g id="Arrived_Status_Pill" transform="translate(142, 38)">
      <rect width="170" height="38" rx="19" fill="url(#suiteTopCapsuleGlass)" stroke="#323C4C" stroke-width="1.2"/>
      <path d="M 22 19.5 L 27 24.5 L 38 13.5" fill="none" stroke="#4EE49B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="47" y="24.5" class="sf-semibold" font-size="15.5" fill="#FFFFFF" letter-spacing="-0.2">Arrived • 56s</text>
    </g>

    <!-- Center Navigation Pod -->
    <g id="Arrived_Center_Pod">
      <circle cx="227" cy="142" r="42" fill="#1C212B"/>
      <g id="Arrived_Arrow" transform="translate(227, 142) scale(0.78)">
        <path d="M 16.6 -19.3
                 C 17.8 -20.8 19.8 -19.5 18.8 -17.8
                 L 4.6 33.9
                 C 3.8 35.8 1.4 35.5 0.2 33.0
                 L -7.8 11.3
                 L -31.7 10.4
                 C -33.8 10.3 -34.4 7.5 -32.6 6.4
                 Z"
              fill="#4EE49B"
              stroke="#4EE49B"
              stroke-width="3.2"
              stroke-linejoin="round"
              stroke-linecap="round"/>
      </g>
    </g>

    <!-- Typography -->
    <g id="Arrived_Typography">
      <text x="227" y="234" text-anchor="middle" class="sf-semibold" font-size="22" fill="#7D8B9B" letter-spacing="-0.2">Destination Reached</text>
      <text x="227" y="268" text-anchor="middle" class="sf-bold" font-size="21.5" fill="#FFFFFF" letter-spacing="-0.3">123 Nguyen Thi Minh Khai, Q.1</text>
    </g>

    <!-- Telemetry Card (3 columns) -->
    <g id="Arrived_Telemetry_Card" transform="translate(42, 314)">
      <rect width="370" height="74" rx="37" fill="url(#suiteBottomCardGlass)" stroke="#27313E" stroke-width="1.2"/>
      
      <line x1="124" y1="15" x2="124" y2="59" stroke="#222C3A" stroke-width="1.2"/>
      <line x1="246" y1="15" x2="246" y2="59" stroke="#222C3A" stroke-width="1.2"/>

      <!-- TIME -->
      <g id="Arrived_Time">
        <text x="64" y="39" text-anchor="middle" class="sf-bold" font-size="24" fill="#4EE49B">22<tspan font-size="16.5" font-family="-apple-system, sans-serif">m</tspan></text>
        <text x="64" y="58" text-anchor="middle" class="sf-semibold" font-size="11" fill="#4EE49B" letter-spacing="0.8">TIME</text>
      </g>

      <!-- DISTANCE -->
      <g id="Arrived_Distance">
        <text x="185" y="39" text-anchor="middle" class="sf-bold" font-size="24" fill="#FFFFFF">8.4<tspan font-size="15.5" font-family="-apple-system, sans-serif">km</tspan></text>
        <text x="185" y="58" text-anchor="middle" class="sf-semibold" font-size="11" fill="#758498" letter-spacing="0.8">DISTANCE</text>
      </g>

      <!-- AVG SPEED -->
      <g id="Arrived_Speed">
        <text x="306" y="39" text-anchor="middle" class="sf-bold" font-size="24" fill="#FFFFFF">26<tspan font-size="15.5" font-family="-apple-system, sans-serif">km/h</tspan></text>
        <text x="306" y="58" text-anchor="middle" class="sf-semibold" font-size="11" fill="#758498" letter-spacing="0.8">AVG SPEED</text>
      </g>
    </g>
  </g>
</svg>
